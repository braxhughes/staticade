<!doctype html>
<meta charset="utf-8">
<title>readme render</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block;width:100vw;height:100vh}</style>
<canvas id="c"></canvas>
<script type="module">
// Draws one README picture with the game's own dot renderer, font and CRT pass.
// The scene comes from window.__SCENE (set by render.mjs before load).
import { createGfx } from '/engine/gl-dots.js';
import { createCrt } from '/engine/crt.js';
import { createText } from '/engine/font.js';

const S = window.__SCENE;
const canvas = document.getElementById('c');
const gfx = createGfx(canvas, { W: S.W, H: S.H, maxDots: 200000, maxDpr: 4 });
const crt = createCrt(gfx);
gfx.resize();
const clock = { F: 0 };
const text = createText(gfx.dot, clock);

// small seeded generator so every run draws the same stars
let seed = S.seed || 7;
const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);

function dottedLine(x1, y1, x2, y2, col, a, step, size) {
  const len = Math.hypot(x2 - x1, y2 - y1), n = Math.max(1, Math.round(len / step));
  for (let i = 0; i <= n; i++) gfx.dot(x1 + (x2 - x1) * i / n, y1 + (y2 - y1) * i / n, size, col[0], col[1], col[2], a);
}

function draw() {
  gfx.reset();
  if (S.stars) for (let i = 0; i < S.stars; i++) {
    const b = 0.15 + rnd() * 0.35;
    gfx.dot(rnd() * S.W, rnd() * S.H, 0.5 + rnd() * 0.6, 0.7 * b, 0.8 * b, b, 1);
  }
  for (const it of S.items) {
    const col = it.col || [1, 1, 1], a = it.a == null ? 1 : it.a, step = it.step || 2, size = it.size || 0.8;
    if (it.text != null) text(it.text, it.x, it.y, col, it.sc || 1, it.align || 'l', a, 0);
    else if (it.box) {
      const [x, y, w, h] = it.box;
      dottedLine(x, y, x + w, y, col, a, step, size); dottedLine(x, y + h, x + w, y + h, col, a, step, size);
      dottedLine(x, y, x, y + h, col, a, step, size); dottedLine(x + w, y, x + w, y + h, col, a, step, size);
    } else if (it.line) dottedLine(it.line[0], it.line[1], it.line[2], it.line[3], col, a, step, size);
    else if (it.dot) gfx.dot(it.dot[0], it.dot[1], it.dot[2] || 1, col[0], col[1], col[2], a);
  }
  crt.flush(gfx.count(), 0, 0, S.crt !== false, 0.5);
}
draw();
requestAnimationFrame(() => { draw(); requestAnimationFrame(() => { draw(); window.__DONE = { dots: gfx.count(), w: canvas.width, h: canvas.height }; }); });
</script>
